# InAppFigma long-task configuration
#
# This file is generated in the project-root InAppFigma/ directory for
# development orchestration only. Keep it outside the app target, Compile
# Sources, and Copy Bundle Resources. The shipped app never parses this file.
#
# Hierarchy: module -> page -> state. Pages declare page_role: screen or popup.
# A reusable popup owns enabled text slots, ordered button ids, and appearance.
# Each present_popup action supplies the concrete text and caller-owned button
# callbacks for one presentation; do not duplicate popup appearance as source
# page states.
#
# Page lifecycle:
#   todo -> in_progress -> done
#                       -> failed  (eligible for another claim)
#                       -> blocked (requires an explicit requeue)
#   done -> in_progress (amendment; archives the accepted baseline)
#
# Behaviors describe page events. When an interaction runs, apply state_change
# first, then execute actions in declaration order. Navigation and popup
# destinations use canonical module.page ids.
#
# Each state, behavior, and popup structure is an independently editable task.
# New tasks start at implementation_status: todo. accepted_baseline and
# removed_tasks are tool-owned; do not hand-edit their contracts or membership.
