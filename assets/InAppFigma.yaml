#
# Navigate styles:
#   push, sheet, full_screen: require a screen destination: module.page
#   back, dismiss:             optional screen destination identifies the existing page revealed afterward
#   external:                  requires url instead of destination
# present_popup requires a popup destination: module.page, exact content keys
# for enabled template fields, and one text/callback binding per ordered button.
# Clicking a popup button closes that popup before its optional caller state
# change and ordered callback actions. dismiss_popup has no destination. An
# action list permits at most one presentation-changing action (navigate,
# present_popup, or dismiss_popup), and it must be the final item.
#
# page_type view creates {Title}View.swift. page_type view_controller also
# creates {Title}ViewController.swift, which embeds the SwiftUI view through a
# child system UIHostingController. Legacy pages without page_type default to
# view. Legacy popup-like states require manual remodeling into popup pages;
# migration never infers that intent.
#
# execution.parallel: true is an explicit request to use the skill's parallel
# workflow when at least two pages/modules are independent. max_parallel limits
# the concurrent batch size; it does not make dependent pages parallel.
#
# system_ui flags are explicit visual-gate exceptions. true requires proof that
# the implementation uses the corresponding system component. Review then
# ignores only OS-owned pixels inside that component boundary while continuing
# to verify app-controlled content, state, behavior, and surrounding layout.

schema_version: 6
delivery:
  profile: strict
execution:
  parallel: false
  max_parallel: 3
system_ui:
  tab_bar_controller: false
  picker: false
mock_data_sources: []
modules: []
